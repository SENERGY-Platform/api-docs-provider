name: Build, Test & Upload

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]-beta[0-9]+'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: go test -v -race ./...

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  build:
    needs: test
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: |
        VERSION=${{ github.ref_name }}
      meta-images: |
        ghcr.io/senergy-platform/api-docs-provider
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ github.ref_name }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
